<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>أصالة — بوستين تفاعليين</title>
  <style>
    :root {
      --ink: #20120e;
      --paper: #f4ead8;
      --muted: #7a5848;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f4ead8;
      color: var(--ink);
      font-family: "IBM Plex Sans Arabic", "Noto Naskh Arabic", sans-serif;
    }
    header {
      padding: 40px 32px 16px;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      font-family: Amiri, serif;
      font-size: 42px;
      font-weight: 700;
      margin: 0 0 8px;
    }
    p.lead {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px;
    }
    figure { margin: 0; }
    img {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid #c4a870;
    }
    figcaption {
      margin-top: 14px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
    }
    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>أصالة — تجربة محتوى تفاعلي</h1>
    <p class="lead">إنستغرام ٤:٥ · خياران للتفاعل مع الجمهور · أغنية أصالة الجديدة</p>
  </header>
  <div class="grid">
    <figure>
      <img src="../exports/01-ayy-bayt-aqwa.png" alt="بوست ١: أي بيت أقوى" />
      <figcaption>١ — تصويت بالرقم. البيت الأقوى في التعليق.</figcaption>
    </figure>
    <figure>
      <img src="../exports/02-kammil-albayt.png" alt="بوست ٢: كمّل البيت" />
      <figcaption>٢ — كمّل البيت الناقص، ومنشن شخص وفيّ.</figcaption>
    </figure>
  </div>
</body>
</html>
